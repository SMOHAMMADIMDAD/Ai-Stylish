<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyvia - Coming Soon</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 30px;
    }

    .headline {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .subtext {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 30px;
    }

    .email-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 5px;
    }

    button {
      padding: 12px 18px;
      border: none;
      background: #fff;
      color: #000;
      cursor: pointer;
      border-radius: 5px;
      font-weight: 600;
      transition: 0.3s;
    }

    button:hover {
      background: #ddd;
    }

    .footer {
      font-size: 12px;
      color: #777;
    }

    .brand {
      font-weight: 600;
      letter-spacing: 3px;
    }

  </style>

</head>

<body>

<p class="headline">Summer Drop Coming Soon</p>

</p>

  <input type="email" placeholder="Enter your email">
  <button>Notify Me</button>
